<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LifeLink - Hospital Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "outline-variant": "#e3bebd",

                        "surface-container-highest": "#e1e3e4",
                        "on-surface": "#191c1d",
                        "inverse-on-surface": "#f0f1f2",
                        "primary-container": "#c41e3a",

                        "tertiary-fixed": "#cae6ff",

                        "base": "8px",

<style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body class="h-full flex flex-col md:flex-row antialiased text-on-background">
<!-- Left Side: Registration Form -->
<main class="w-full md:w-1/2 flex flex-col justify-center px-container-margin-mobile md:px-container-margin-desktop py-stack-lg bg-surface">
<div class="max-w-md w-full mx-auto">
<!-- Brand Header -->
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-display-lg text-headline-md font-bold text-primary flex items-center justify-center md:justify-start gap-2 mb-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
                    LifeLink
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Hospital Partner Registration</p>
</div>
<!-- Form -->
<form class="space-y-stack-md bg-surface-container-lowest p-stack-md md:p-stack-lg rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-surface-variant">
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm uppercase tracking-wider" for="orgName">Organization Name</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-body-md" id="orgName" name="orgName" placeholder="Enter full hospital name" type="text"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm uppercase tracking-wider" for="regId">Medical Registration ID</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-body-md" id="regId" name="regId" placeholder="e.g. HOS-12345-REG" type="text"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm uppercase tracking-wider" for="email">Official Email Address</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-body-md" id="email" name="email" placeholder="admin@hospital.org" type="email"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm uppercase tracking-wider" for="password">Secure Password</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-stack-sm">
<button class="w-full bg-primary-container text-on-primary rounded-lg py-3 px-4 font-label-bold text-label-bold uppercase tracking-wider hover:bg-primary transition-colors shadow-md active:scale-[0.98]" type="submit">
                        Register Medical Facility
                    </button>
</div>
<p class="text-center mt-stack-md font-body-sm text-body-sm text-on-surface-variant">
                    Already registered? <a class="text-secondary font-medium hover:underline" href="#">Log in here</a>
</p>
</form>
</div>
</main>
<!-- Right Side: Imagery / Illustration -->
<aside class="hidden md:flex w-1/2 relative bg-surface-container-highest overflow-hidden">
<!-- Background Image -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A clean, modern medical setting featuring advanced medical equipment subtly blurred in the background. The scene is brightly lit with cool, clinical lighting, conveying trust and technological advancement. A soft blue and white color palette dominates, creating a sterile yet approachable atmosphere suitable for a healthcare networking platform." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAkMGZaHVKbgvB1v_qHnAO8ZFbj_uhaNCmnHYXLSED_-nH4mVYva5cFbnVPjc_vDFxx1kY5KdTfBP7JXk3XQxWQYj2yYf5U9diJ1Q32qwk3dfSggnXg8T58H0OR2ZcJ33_Q7ODu2VWy2_7g8l8RhLEKcVyjP85uhvLiBohkyZstLMX0zpaG8AaQ5tQdyPssaSDyhgwUC8P3IB0V-amW8KllZ07carcyY4xvBIqvjHpMbKH3PMeVW7m2')"></div>
<!-- Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/90 to-inverse-surface/20"></div>
<!-- Messaging Content -->
<div class="relative z-10 p-container-margin-desktop flex flex-col justify-end h-full text-surface-container-lowest">
<h2 class="font-display-lg text-display-lg mb-stack-md leading-tight max-w-lg">
                Connecting Care.<br/>Saving Lives.
            </h2>
<p class="font-body-lg text-body-lg text-surface-variant max-w-md mb-stack-lg">
                Join the LifeLink network to rapidly connect with donors during critical emergencies. Seamless coordination when seconds matter most.
            </p>
<!-- Trust Indicators -->
<div class="flex gap-stack-md">
<div class="flex items-center gap-2 bg-surface/10 backdrop-blur-sm px-4 py-2 rounded-full border border-surface/20">
<span class="material-symbols-outlined text-primary-fixed" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-md text-label-md">Verified Network</span>
</div>
<div class="flex items-center gap-2 bg-surface/10 backdrop-blur-sm px-4 py-2 rounded-full border border-surface/20">
<span class="material-symbols-outlined text-secondary-fixed" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-label-md text-label-md">Secure Data</span>
</div>
</div>
</div>
</aside>
</body></html>
