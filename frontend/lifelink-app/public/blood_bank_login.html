<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>LifeLink - Blood Bank Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#c41e3a",
                        "primary-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#41000b",
                        surface: "#f8f9fa",
                        "on-surface": "#191c1d",
                        "surface-variant": "#e1e3e4",
                        "on-surface-variant": "#444748",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "outline-variant": "#c4c7c8",
                        secondary: "#356382",
                    },
                    fontFamily: {
                        "display-lg": ["Montserrat"],
                        "body-md": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-sm": ["Inter"],
                    }
                }
            }
        }
    </script>
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center antialiased text-on-background bg-surface">

<main class="w-full max-w-md px-6 flex flex-col justify-center">
    <div class="max-w-md w-full mx-auto">
        <div id="login-brand" class="flex items-center gap-2 mb-8 justify-center">
            <span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">water_drop</span>
            <span class="font-display-lg text-3xl font-bold text-primary">Blood Bank Portal</span>
        </div>
        
        <!-- Toggle Buttons -->
        <div class="flex rounded-lg bg-surface-variant p-1 mb-6">
            <button id="tab-login" class="flex-1 py-2 text-sm font-label-bold rounded-md bg-surface-container-lowest text-on-surface shadow-sm transition-all">Login</button>
            <button id="tab-register" class="flex-1 py-2 text-sm font-label-bold rounded-md text-on-surface-variant hover:text-on-surface transition-all">Register</button>
        </div>

        <form id="bb-form" class="space-y-4 bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-surface-variant">
            
            <h2 id="form-title" class="font-display-lg text-xl font-bold text-on-surface mb-2">Login to Portal</h2>
            
            <div>
                <label class="block font-label-bold text-xs text-on-surface mb-1 uppercase tracking-wider">Registered Blood Bank Name</label>
                <input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-primary outline-none transition-all font-body-md text-sm" id="bbName" placeholder="e.g. Metro Blood Center" type="text" required>
            </div>
            <div>
                <label class="block font-label-bold text-xs text-on-surface mb-1 uppercase tracking-wider">Admin Unique ID</label>
                <input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-primary outline-none transition-all font-body-md text-sm" id="uniqueId" placeholder="e.g. BB-998877" type="text" required>
                <p class="text-[10px] text-on-surface-variant mt-1 italic">* Must be provided by system administrator.</p>
            </div>
            <div>
                <label class="block font-label-bold text-xs text-on-surface mb-1 uppercase tracking-wider">Password</label>
                <input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-primary outline-none transition-all font-body-md text-sm" id="password" placeholder="••••••••" type="password" required>
                <p id="pwd-reqs" class="hidden text-[10px] text-primary mt-1">Must be min 8 chars, 1 uppercase, 1 number, 1 special char.</p>
            </div>
            
            <div class="pt-2">
                <button id="submit-btn" class="w-full bg-primary text-on-primary rounded-lg py-3 px-4 font-label-bold text-xs uppercase tracking-wider hover:bg-opacity-90 transition-colors shadow-md active:scale-[0.98]" type="submit">
                    Login
                </button>
            </div>
        </form>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        let isLogin = true;
        
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const pwdReqs = document.getElementById('pwd-reqs');

        function setMode(loginMode) {
            isLogin = loginMode;
            if (isLogin) {
                tabLogin.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
                tabLogin.classList.remove('text-on-surface-variant');
                tabRegister.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
                tabRegister.classList.add('text-on-surface-variant');
                
                formTitle.innerText = "Login to Portal";
                submitBtn.innerText = "Login";
                pwdReqs.classList.add('hidden');
            } else {
                tabRegister.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
                tabRegister.classList.remove('text-on-surface-variant');
                tabLogin.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
                tabLogin.classList.add('text-on-surface-variant');
                
                formTitle.innerText = "Register Blood Bank";
                submitBtn.innerText = "Complete Registration";
                pwdReqs.classList.remove('hidden');
            }
        }

        tabLogin.addEventListener('click', () => setMode(true));
        tabRegister.addEventListener('click', () => setMode(false));

        document.getElementById('bb-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('bbName').value;
            const uniqueId = document.getElementById('uniqueId').value;
            const password = document.getElementById('password').value;
            
            // Password Validation (only enforce stringently on registration per standard, but we'll enforce both to be safe based on prompt)
            if (!isLogin) {
                const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
                if (!passwordRegex.test(password)) {
                    alert("Password does not meet requirements:\n- Minimum 8 characters\n- At least 1 uppercase letter\n- At least 1 number\n- At least 1 special character");
                    return;
                }
            }

            // We securely map the Unique ID to the system's internal email identifier structure
            const internalEmail = uniqueId.toLowerCase().replace(/[^a-z0-9]/g, '') + '@bb.lifelink.internal';

            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'Processing...';
            submitBtn.disabled = true;

            try {
                let endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
                let bodyData = isLogin 
                    ? { email: internalEmail, password: password }
                    : { 
                        name: name + ' Admin', 
                        email: internalEmail, 
                        password: password, 
                        role: 'BLOOD_BANK',
                        hospitalOrBankDetails: {
                            name: name,
                            district: 'Network Wide', // Can be updated in settings later
                            address: 'Verified Admin Setup',
                            phone: 'N/A'
                        }
                      };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    // Redirect blood banks to their dashboard (which we can route to later, for now we will route to dashboard)
                    window.location.href = '/bb-dashboard'; 
                } else {
                    alert(isLogin ? 'Login failed. Please check your credentials.' : 'Registration failed: ' + data.error);
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert('Could not connect to the server.');
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        });
    });
</script>

</body>
</html>
