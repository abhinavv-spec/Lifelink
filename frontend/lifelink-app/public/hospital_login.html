<body class="h-screen w-full flex flex-col items-center justify-center antialiased text-on-background bg-surface">
<!-- Left Side: Registration Form -->
<main class="w-full max-w-md px-6 flex flex-col justify-center">
<div class="max-w-md w-full mx-auto">
<!-- Brand Header -->

<!-- Form -->

<div id="login-brand" class="flex items-center gap-2 mb-8 justify-center">
    <span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
    <span class="font-display-lg text-4xl font-bold text-primary">LifeLink</span>
</div>
    
<form id="register-form" class="space-y-stack-md bg-surface-container-lowest p-stack-md md:p-stack-lg rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-surface-variant">
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm uppercase tracking-wider" for="orgName">Organization Name</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-body-md" id="orgName" name="orgName" placeholder="Enter full hospital name" type="text">
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm uppercase tracking-wider" for="regId">Medical Registration ID</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-body-md" id="regId" name="regId" placeholder="e.g. HOS-12345-REG" type="text">
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm uppercase tracking-wider" for="email">Official Email Address</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-body-md" id="email" name="email" placeholder="admin@hospital.org" type="email">
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm uppercase tracking-wider" for="password">Secure Password</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password">
</div>
<div class="pt-stack-sm">
<button class="w-full bg-primary-container text-on-primary rounded-lg py-3 px-4 font-label-bold text-label-bold uppercase tracking-wider hover:bg-primary transition-colors shadow-md active:scale-[0.98]" type="submit">
                        Register Medical Facility
                    </button>
</div>
<p class="text-center mt-stack-md font-body-sm text-body-sm text-on-surface-variant">
                    Already registered? <a class="text-secondary font-medium hover:underline" href="/login">Log in here</a>
</p>
</form>
</div>
</main>
<!-- Right Side: Imagery / Illustration -->






<script>
    document.addEventListener('DOMContentLoaded', () => {
        const notifBtn = document.getElementById('notification-btn');
        const notifPanel = document.getElementById('notification-panel');
        if (notifBtn && notifPanel) {
            notifBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                notifPanel.classList.toggle('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!notifPanel.contains(e.target)) {
                    notifPanel.classList.add('hidden');
                }
            });
        }
    });
</script>

<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const orgName = document.getElementById('orgName').value;
        const regId = document.getElementById('regId').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');
        
        const originalText = submitBtn.innerText;
        submitBtn.innerText = 'Registering...';
        submitBtn.disabled = true;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: orgName + ' Admin',
                    email: email,
                    password: password,
                    role: 'HOSPITAL',
                    hospitalOrBankDetails: {
                        name: orgName,
                        district: 'Central',
                        address: '123 Medical Way',
                        phone: '555-0000'
                    }
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Store the JWT token
                localStorage.setItem('token', data.data.token);
                localStorage.setItem('user', JSON.stringify(data.data.user));
                
                // Redirect to the dashboard
                window.location.href = '/dashboard';
            } else {
                alert('Registration failed: ' + (data.error || 'Unknown error'));
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error('Auth error:', error);
            alert('Could not connect to the server.');
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
